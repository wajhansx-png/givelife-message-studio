<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile verification</title>
<style>body{font:14px system-ui;background:#d8d8d4;margin:0}#qaTools{position:fixed;left:460px;top:16px;right:16px}#metrics{position:fixed;left:460px;top:130px;right:16px}button{padding:10px;margin:4px}pre{white-space:pre-wrap;max-width:1000px}iframe{display:block;border:0;box-shadow:0 0 0 1px #aaa;margin:0}</style>
<div id="qaTools"><button onclick="size(360,740)">360 × 740</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(430,932)">430 × 932</button><button onclick="size(390,480)">Keyboard space</button>
<button onclick="size(1024,768)">1024 × 768</button><button onclick="size(1440,900)">1440 × 900</button><button onclick="longReply()">Simulate long reply</button><button onclick="measure()">Measure layout</button>
</div><pre id="metrics"></pre><iframe title="Mobile studio" src="/" width="390" height="844" onload="observe()"></iframe>
<script>
let lastSubmitFocus='Not submitted',events=[];
function size(w,h){const f=document.querySelector('iframe');f.width=w;f.height=h;requestAnimationFrame(measure)}
function observe(){const d=document.querySelector('iframe').contentDocument;d.addEventListener('submit',()=>setTimeout(()=>{lastSubmitFocus=d.activeElement.id||d.activeElement.tagName;measure()},0));d.addEventListener('focusin',e=>{events.push('focus:'+e.target.id);events=events.slice(-8)});setInterval(measure,500)}
function longReply(){document.querySelector('iframe').contentWindow.say('app','A long test reply.\n\n'+Array.from({length:30},(_,i)=>'Paragraph '+(i+1)+': Your conversation stays readable while the keyboard is closed.').join('\n\n'));measure()}
function measure(){const d=document.querySelector('iframe').contentDocument,b=d.querySelector('#histForm .go').getBoundingClientRect(),t=d.querySelector('#histCmd').getBoundingClientRect(),m=d.querySelector('#histMain').getBoundingClientRect(),log=d.querySelector('#histLog');document.querySelector('#metrics').textContent=JSON.stringify({width:d.documentElement.clientWidth,height:d.documentElement.clientHeight,sendWidth:b.width,sendHeight:b.height,bottomClearance:d.documentElement.clientHeight-b.bottom,inputOverlap:t.right>b.left,mainAboveInput:m.bottom<=t.top,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,documentOverflow:d.documentElement.scrollHeight>d.documentElement.clientHeight,lastSubmitFocus,active:d.activeElement.id||d.activeElement.tagName,chatOpen:d.querySelector('#hist').open,logTop:Math.round(log.scrollTop),events})}
</script>
