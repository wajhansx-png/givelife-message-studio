services:
  - type: web
    name: givelife-message-studio
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: UI_ACCESS_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://givelife-message-studio.chicglobe256.chatgpt.site
      - key: DATA_DIR
        value: /tmp/studio
      - key: DB_URI
        sync: false
      - key: PORT
        value: '10000'
