name: Donor priority without receipts
on:
  push:
    paths:
      - donors.js
      - tests/test_priority_without_receipt.py
      - .github/workflows/priority-no-receipt.yml
  pull_request:
    paths:
      - donors.js
      - tests/test_priority_without_receipt.py
      - .github/workflows/priority-no-receipt.yml
jobs:
  priority-no-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p "test_priority_without_receipt.py" -v
      - run: node --check donors.js
