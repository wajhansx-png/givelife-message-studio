name: New studio UI QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: new-studio-ui-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium
      - name: Verify every new studio screen and reported regressions
        run: corepack pnpm test:e2e:new
      - name: Save browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-studio-ui-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
