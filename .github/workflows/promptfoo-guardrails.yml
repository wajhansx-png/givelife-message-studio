name: GiveLife Promptfoo Guardrails (offline)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/evals/**'
      - 'tests/test_policy_goldens.py'
      - 'promptfooconfig.yaml'
      - '.github/workflows/promptfoo-guardrails.yml'
      - 'chat_policy.py'
      - 'conversation_insights.py'
      - 'task_intent.py'
      - 'chat_memory.py'
      - 'chat_runtime.py'
      - 'tests/test_ai_architecture.py'
concurrency:
  group: givelife-policy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: python -m pip install -r requirements.txt
      - name: Python goldens (all 20 cases, no network actions)
        run: python -m unittest discover -s tests -p test_policy_goldens.py -v
      - name: AI and memory regression tests
        run: python -m unittest discover -s tests -p test_ai_architecture.py -v
      - name: Promptfoo offline provider and custom assertions
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
          PROMPTFOO_PASS_RATE_THRESHOLD: '1'
        run: npx --yes promptfoo@latest eval --config promptfooconfig.yaml --no-cache --no-share --no-progress-bar --output promptfoo-guardrails.json
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: givelife-offline-policy-evals
          path: promptfoo-guardrails.json
          if-no-files-found: ignore
          retention-days: 7
