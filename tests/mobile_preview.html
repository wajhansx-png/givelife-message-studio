<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile verification</title>
<style>body{font:14px system-ui;background:#d8d8d4;margin:16px}button{padding:10px;margin:4px}iframe{display:block;border:0;box-shadow:0 0 0 1px #aaa;margin-top:12px}</style>
<button onclick="size(360,740)">360 × 740</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(430,932)">430 × 932</button><button onclick="size(390,480)">Keyboard space</button>
<iframe title="Mobile studio" src="/" width="390" height="844"></iframe>
<button onclick="measure()">Measure layout</button><pre id="metrics"></pre>
<script>function size(w,h){const f=document.querySelector('iframe');f.width=w;f.height=h;requestAnimationFrame(measure)}function measure(){const d=document.querySelector('iframe').contentDocument,b=d.querySelector('#histForm .go').getBoundingClientRect(),t=d.querySelector('#histCmd').getBoundingClientRect();document.querySelector('#metrics').textContent=JSON.stringify({width:d.documentElement.clientWidth,height:d.documentElement.clientHeight,sendWidth:b.width,sendHeight:b.height,bottomClearance:d.documentElement.clientHeight-b.bottom,inputOverlap:t.right>b.left,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth})}</script>
