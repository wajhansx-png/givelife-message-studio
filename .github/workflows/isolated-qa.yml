name: Isolated GiveLife V1 QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/isolated-qa.yml'
      - '*.py'
      - '*.js'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/isolated-qa.yml'
      - '*.py'
      - '*.js'
      - 'tests/**'
      - 'assistant_contract.md'
  workflow_dispatch:
concurrency:
  group: givelife-v1-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fake-transport-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate every Python module compiles
        run: python -m compileall -q -f .
      - name: Python logic and failure-simulation tests
        id: python
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Frontend JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          node --check app.js
          node --check team.js
          node --check donors.js
          node --check connection.js
      - name: Frontend dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: JS unit tests
        id: jsunit
        continue-on-error: true
        run: corepack pnpm test
      - name: Browser dependencies
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Mobile and desktop E2E tests (fake WhatsApp only)
        id: browser
        continue-on-error: true
        run: corepack pnpm test:e2e
      - name: Upload failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: givelife-isolated-qa-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 5
      - name: Enforce full QA pass
        if: always()
        env:
          PY_STATUS: ${{ steps.python.outcome }}
          SYNTAX_STATUS: ${{ steps.syntax.outcome }}
          JS_STATUS: ${{ steps.jsunit.outcome }}
          BROWSER_STATUS: ${{ steps.browser.outcome }}
        run: |
          echo "Python: $PY_STATUS; JS syntax: $SYNTAX_STATUS; JS unit: $JS_STATUS; Browser: $BROWSER_STATUS"
          test "$PY_STATUS" = success && test "$SYNTAX_STATUS" = success && test "$JS_STATUS" = success && test "$BROWSER_STATUS" = success
