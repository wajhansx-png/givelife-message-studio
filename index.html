<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiveLife · Message studio</title>
<style>
:root{color-scheme:light;--bg:#f1f4ef;--surface:#fff;--ink:#20362f;--muted:#62796e;--green:#11634e;--soft:#e9f1e8;--line:#dce6dc;--bubble:#e1f5da}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.4 'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;padding:10px;gap:8px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;min-height:32px;padding:6px 10px;color:var(--ink);background:var(--soft);transition:background .15s,box-shadow .15s}button:hover{background:#dcebdc}button:focus-visible,textarea:focus-visible{outline:3px solid #b3d4a4;outline-offset:2px}button:disabled{opacity:.45;cursor:wait}button.primary{background:var(--green);color:#fff}button.primary:hover{background:#0c513e}button:active{transform:translateY(1px)}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}.brand{display:flex;align-items:center;gap:8px}.brandmark{width:29px;height:29px;background:var(--green);border-radius:10px;color:white;display:grid;place-items:center;font-size:19px}.brand b{font-size:15px;letter-spacing:-.3px}.brand small{font-size:10px;display:block;color:var(--muted);line-height:1.1}.checking{font-size:11px;display:flex;align-items:center;gap:5px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:100%;background:#a5b7a9}.commandbar{display:flex;align-items:center;gap:5px;flex-shrink:0}.views{padding:3px;background:#e2eae0;border-radius:11px;display:flex;gap:2px;margin-right:auto}.views button{background:transparent;min-height:29px;padding:4px 10px;font-size:12px;color:#536b5d}.views button[aria-pressed=true]{background:#fff;color:var(--green);box-shadow:0 1px 4px #28402a13;font-weight:600}.commandbar>button{font-size:12px;padding:5px 9px;background:#fff;border:1px solid var(--line)}#fresh{color:var(--green);font-weight:600}#more{font-weight:700;padding:5px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;gap:8px}body[data-view=group] .grid,body[data-view=dm] .grid{grid-template-columns:1fr}body[data-view=group] #dmCard,body[data-view=dm] #groupCard{display:none}.panel{min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 15px #23382b05}.panelhead{padding:7px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eaf0e8;flex-shrink:0}.panelhead strong{font-size:12px;font-weight:600}.attachment{font-size:10px;color:var(--muted)}.chat{flex:1;min-height:0;padding:9px;overflow:auto;background:#f5f6ef}.bubble{border-radius:11px 3px 11px 11px;background:var(--bubble);padding:11px 12px;box-shadow:0 1px 1px #40593612;overflow-wrap:anywhere}.message{font-size:14px;color:#14281d}.wa-line{white-space:break-spaces;line-height:1.3;min-height:1.3em;overflow-wrap:anywhere;tab-size:4}.wa-line.blank{height:1.3em}.wa-list{display:inline-block;padding-left:12px;text-indent:-9px}.wa-quote{border-left:3px solid #849c83;padding-left:8px;color:#536851}.message code{font-family:Consolas,monospace;background:#bddab64d;padding:1px 3px;border-radius:3px}.poster{display:none}strong{font-weight:700}.show-spaces .wa-line::after{content:'↵';color:#5f8978;font-size:10px}.show-spaces .wa-line.blank{background:#659b5a0b}.space-mark{color:#5f8978}.editorwrap{display:none;flex:0 0 130px;min-height:0;border-top:1px solid var(--line)}.editing .editorwrap{display:block}.editor{width:100%;height:100%;border:0;resize:none;outline:none;padding:10px 12px;background:#fffef8;color:#273c30;font:14px/1.45 'Segoe UI',Arial;white-space:pre-wrap}.editing .chat{padding:6px}.actions{padding:7px;background:#fff;border-top:1px solid #e7eee3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex-shrink:0}.actions button{font-size:11px;line-height:1.2;min-height:30px;padding:5px 6px;background:#edf3e9;border:1px solid #e0e9db;color:#284c38;overflow-wrap:anywhere}.actions .all-groups{grid-column:1/-1;background:var(--green);border-color:var(--green);color:#fff;font-weight:600;font-size:12px;min-height:33px}.dm-actions{grid-template-columns:1fr}.dm-actions button{background:#e9f1e5}.actions .test-button{background:#f5f6f2;color:#667b69;border-color:#e5e9e0}.key{font-size:10px;opacity:.55;padding-left:4px}#groupStatus{font-size:11px;white-space:pre-line;max-height:65px;overflow:auto;background:#fafcf7}#groupStatus:not(:empty){padding:7px 10px;border-top:1px solid var(--line)}.footer{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:10px;color:var(--muted);flex-shrink:0;padding:0 2px}.footer #status{color:var(--green);font-weight:600}.shortcuts{white-space:nowrap}.options{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:5px;align-items:center;flex-shrink:0}.options[hidden]{display:none}.options button{font-size:11px;min-height:28px}.options span{font-size:10px;color:var(--muted)}.formatbar{display:none;gap:4px;align-items:center;background:#fff;padding:4px 7px;border:1px solid var(--line);border-radius:9px;flex-shrink:0}.is-editing .formatbar{display:flex}.formatbar button{min-height:27px;padding:3px 10px;font-size:12px}.formatbar span{font-size:10px;color:var(--muted);margin-left:auto}body[data-view=both] .actions{grid-template-columns:1fr 1fr}body[data-view=both] .actions button{font-size:10px;min-height:27px}body[data-view=both] .bubble{padding:8px}.meta{display:none}@media(max-width:440px){body{padding:6px;gap:6px}.brand b{font-size:14px}.brand small{display:none}.checking{font-size:10px}.commandbar{gap:3px}.commandbar>button{padding:5px 6px;font-size:11px}.views button{padding:4px 7px}.key{display:none}.actions button{font-size:10px}.shortcuts{display:none}}@media(prefers-reduced-motion:reduce){button{transition:none}}
body{padding:8px;gap:6px}.brandmark{width:25px;height:25px;border-radius:8px}.brand small{display:none}.commandbar button{min-height:28px}.views{padding:2px}.views button{min-height:26px}.panelhead{padding:4px 10px}.bubble{padding:8px 10px}.actions{grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;gap:4px}.actions button{font-size:10px;min-height:29px;padding:4px 3px}.actions .test-button{grid-column:1}.actions .all-groups{grid-column:2/-1;min-height:29px}.dm-actions{grid-template-columns:1fr}body[data-view=both] .actions .all-groups{grid-column:1/-1}body[data-view=both] .actions .test-button{grid-column:auto}
</style></head>
<body data-view="group">
<div class="brandbar"><div class="brand"><div class="brandmark">♡</div><div><b>GiveLife</b><small>Message studio</small></div></div><span class="checking" title="Automatic donor checks are off. Ask in chat to start checking."><span class="dot"></span>Donor checks off</span></div>
<div class="commandbar"><div class="views" aria-label="Message view"><button data-view-button="group" aria-pressed="true" title="Group message · G">Group<span class="key">G</span></button><button data-view-button="dm" aria-pressed="false" title="Donor message · D">DM<span class="key">D</span></button><button data-view-button="both" aria-pressed="false" title="Compare both · B">Both</button></div><button id="edit" title="Edit caption · E">✎ Edit</button><button id="fresh" title="Prepare new group wording · N">↻ New</button><button id="more" title="Text size, spaces and copy" aria-expanded="false" aria-controls="options">···</button></div>
<div id="options" class="options" hidden><button id="size" title="Toggle larger reading text">A+ Larger text</button><button id="spaces" aria-pressed="false">Show spaces</button><button id="copy" title="Copy current caption · C">Copy caption</button><span>Preview formatting stays intact.</span></div>
<div class="formatbar"><button data-format="bold" title="Bold selected text"><b>B</b></button><button data-format="italic" title="Italic selected text"><i>I</i></button><button data-format="both" title="Bold italic selected text"><b><i>BI</i></b></button><button data-format="bullet" title="Add bullet">• List</button><span>Select text to format · Esc finishes</span></div>
<main class="grid">
<section id="groupCard" class="panel"><div class="panelhead"><strong>Group caption</strong><span class="attachment">▧ Poster included</span></div><div class="chat"><div class="bubble"><div class="message" id="groupPreview"></div></div></div><div class="editorwrap"><textarea class="editor" id="group" aria-label="Edit group message" spellcheck="true"></textarea></div><div class="actions group-actions"><button data-group="community" title="Send to Upwork Community 2026">Upwork Community</button><button data-group="fiverr" title="Send to Fiverr Course 2026">Fiverr Course</button><button data-group="upwork" title="Send to Upwork Course 2026">Upwork Course</button><button data-group="uet" title="Send to Fiverr Course UET">Fiverr UET</button><button data-group="toprated" title="Send to Top Rated Upworkers">Top Rated Upworkers</button><button class="test-button" data-send="group" title="Send group caption and poster to Givelife test">Test group</button><button data-group="all" class="all-groups">Send to all 5 freelance groups ↗</button></div><div id="groupStatus" role="status"></div></section>
<section id="dmCard" class="panel"><div class="panelhead"><strong>Donor caption</strong><span class="attachment">▧ Poster included on send</span></div><div class="chat"><div class="bubble"><div class="message" id="dmPreview"></div></div></div><div class="editorwrap"><textarea class="editor" id="dm" aria-label="Edit donor message" spellcheck="true"></textarea></div><div class="actions dm-actions"><button data-send="dm">Send a test to Givelife test ↗</button></div></section>
</main>
<div class="footer"><span id="status" role="status">Loading…</span><span class="shortcuts">G Group · D DM · E Edit · N New · C Copy</span><span title="All groups send one minute apart. Minimum 15 minutes between posts in the same group.">60s gaps · 15m per group</span></div>
<script src="/connection.js"></script><script src="/format.js"></script><script src="/app.js"></script></body></html>
