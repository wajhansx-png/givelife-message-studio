name: Private donor import checks
on:
  push:
    paths:
      - "private_donor_import.py"
      - "launcher.py"
      - "tests/test_private_donor_import.py"
      - ".github/workflows/private-donor-import.yml"
  pull_request:
    paths:
      - "private_donor_import.py"
      - "launcher.py"
      - "tests/test_private_donor_import.py"
      - ".github/workflows/private-donor-import.yml"
jobs:
  offline-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Offline tests — synthetic numbers only
        run: python -m unittest discover -s tests -p "test_private_donor_import.py" -v
      - name: Compile changed Python
        run: python -m py_compile private_donor_import.py launcher.py
