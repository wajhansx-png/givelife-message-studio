<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#171717"><title>Agents · GiveLife</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/agents.css"></head>
<body>
<header class="top">
 <div class="bar">
  <a class="back" href="/" aria-label="Back to GiveLife">←</a>
  <nav id="list" class="list" aria-label="Agents"></nav>
  <button type="button" id="modeAuto" class="auto" role="switch" aria-checked="false" title="Auto: agents post, read and reply on their own">Auto</button>
 </div>
 <details id="issuesPanel" class="issues-panel" hidden><summary id="issuesSummary">Issues</summary><div id="notes" class="notes"></div></details>
</header>
<main class="chat" id="scroll">
 <h1 id="name" class="sr"></h1>
 <div id="rules" class="rules" hidden></div>
 <section id="thread" class="thread" aria-live="polite"></section>
</main>
<div class="review-strip" id="reviewStrip" hidden><button type="button" id="reviewDraft">Review WhatsApp draft</button></div>
<form id="ask" class="ask" autocomplete="off">
 <p id="msg" class="msg" role="status" aria-live="polite"></p>
 <div class="box"><label for="inp" class="sr">Message</label><textarea id="inp" rows="1" maxlength="2000" placeholder="Message Manager" enterkeyhint="send"></textarea><button class="send" aria-label="Send" disabled>↑</button></div>
</form>
<section id="draftPreview" class="draft-review" role="dialog" aria-modal="true" aria-label="Review Group message" hidden>
 <header class="draft-top">
  <button type="button" id="draftClose" class="draft-back" aria-label="Close preview">←</button>
  <div class="draft-title"><strong>Group message</strong><span>Review before saving · Not sent</span></div>
  <span class="draft-label">WhatsApp preview</span>
 </header>
 <div class="draft-stage" id="draftStage" aria-label="Full message preview">
  <article class="draft-paper" id="draftPaper"><div class="draft-body" id="draftText"></div><div class="draft-meta">Draft · Not sent <span aria-hidden="true">✓</span></div></article>
 </div>
 <footer class="draft-actions">
  <button type="button" id="draftNext" class="draft-next">Next version</button>
  <button type="button" id="draftApprove" class="draft-approve">Approve &amp; save to Group</button>
 </footer>
</section>
<dialog id="accessDialog"><form id="accessForm"><h2>Open GiveLife agents</h2><label for="accessKey">Private cloud access key</label><input type="password" id="accessKey" autocomplete="current-password" required><button class="primary">Unlock</button></form></dialog>
<script src="/format.js"></script>
<script src="/agents.js"></script>
</body>
</html>
